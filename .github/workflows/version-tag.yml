name: Auto Version Tag

on:
  pull_request:
    types: [closed]
    branches: [origin]

jobs:
  tag-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump type
        id: bump
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          BUMP="patch"

          # Check labels first (highest priority)
          if echo "$PR_LABELS" | grep -qi "major\|breaking"; then
            BUMP="major"
          elif echo "$PR_LABELS" | grep -qi "minor\|feature"; then
            BUMP="minor"
          elif echo "$PR_LABELS" | grep -qi "patch\|fix\|bugfix"; then
            BUMP="patch"
          # Fallback: check PR title prefix
          elif echo "$PR_TITLE" | grep -qiE "^(breaking|major)"; then
            BUMP="major"
          elif echo "$PR_TITLE" | grep -qiE "^(feat|feature|minor)"; then
            BUMP="minor"
          elif echo "$PR_TITLE" | grep -qiE "^(fix|patch|bugfix|hotfix|chore|docs|refactor)"; then
            BUMP="patch"
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Get latest tag
        id: latest
        run: |
          # Get the latest semver tag, default to v0.0.0 if none exists
          LATEST=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          BUMP="${{ steps.bump.outputs.type }}"

          # Strip the 'v' prefix
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New tag: $NEW_TAG"

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.new_version.outputs.tag }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          BUMP="${{ steps.bump.outputs.type }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG} (${BUMP})

          PR #${PR_NUM}: ${PR_TITLE}
          ${PR_URL}"

          git push origin "$NEW_TAG"

      - name: Generate release notes
        id: release_notes
        run: |
          NEW_TAG="${{ steps.new_version.outputs.tag }}"
          PREV_TAG="${{ steps.latest.outputs.tag }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUM="${{ github.event.pull_request.number }}"

          # Build commit log between previous tag and new tag
          if [ "$PREV_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          NOTES="## What's Changed

          **PR #${PR_NUM}: [${PR_TITLE}](${PR_URL})**

          ### Commits
          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${NEW_TAG}"

          # Write notes to file to preserve multiline content
          echo "$NOTES" > "${{ runner.temp }}/release_notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.new_version.outputs.tag }}"
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes-file "${{ runner.temp }}/release_notes.md"

      - name: Summary
        run: |
          echo "## Version Tagged" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.latest.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New | \`${{ steps.new_version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump | \`${{ steps.bump.outputs.type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | #${{ github.event.pull_request.number }} |" >> "$GITHUB_STEP_SUMMARY"
